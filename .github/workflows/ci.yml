name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          # mise-action forces `--locked`, which needs platform URLs this mise.lock lacks.
          install: false
      - run: mise install
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
      - run: bun install --frozen-lockfile
      - run: mise run preflight
      - run: bun run build
      - run: bunx --no-install playwright install-deps chromium
      - run: mise run e2e
