name: Release
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which semver part to bump
        required: true
        type: choice
        options: [patch, minor, major]
      notes:
        description: Release notes for the GitHub Release and the sidebar's What's new (generated when empty)
        required: false
        type: string
permissions: {}
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/trunk' && github.triggering_actor == github.repository_owner
    runs-on: ubuntu-latest
    environment: chrome-web-store
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          cache: false
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
      - run: bun install --frozen-lockfile
      - run: mise run preflight
      - id: bump
        run: |
          version="$(bun scripts/tasks/cli.ts version "$BUMP")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
        env:
          BUMP: ${{ inputs.bump }}
      # Before the build: the build ships these notes, and the Release publishes the same file.
      - name: Resolve the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.notes }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          if [ -n "$NOTES" ]; then
            printf '%s\n' "$NOTES" > "$RUNNER_TEMP/notes.md"
          else
            gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="v$VERSION" -f target_commitish="$GITHUB_SHA" --jq .body > "$RUNNER_TEMP/notes.md"
          fi
      - run: WXT_RELEASE_NOTES="$(cat "$RUNNER_TEMP/notes.md")" bunx wxt zip
      # Commit before submit: expectedHeadOid fails the commit cleanly if trunk moved, before the store sees anything.
      # Trunk requires signed commits, and GitHub signs a commit made through its API, not one pushed with git.
      - name: Commit and tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          sha="$(jq -n --rawfile pkg package.json '{
            query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
            variables: {input: {
              branch: {repositoryNameWithOwner: env.GITHUB_REPOSITORY, branchName: "trunk"},
              expectedHeadOid: env.GITHUB_SHA,
              message: {headline: "chore: bump version to \(env.VERSION)"},
              fileChanges: {additions: [{path: "package.json", contents: ($pkg | @base64)}]}
            }}
          }' | gh api graphql --input - -q .data.createCommitOnBranch.commit.oid)"
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/v$VERSION" -f sha="$sha"
      - name: Submit to the Chrome Web Store
        run: bunx wxt submit --chrome-zip ".output/gh-prism-$VERSION-chrome.zip"
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
          CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
          CHROME_API_VERSION: v2
          CHROME_SKIP_SUBMIT_REVIEW: "false"
          CHROME_CANCEL_PENDING: "false"
          CHROME_SKIP_REVIEW: "false"
          CHROME_PUBLISH_TYPE: DEFAULT_PUBLISH
          CHROME_DEPLOY_PERCENTAGE: "100"
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --verify-tag --title "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md"
